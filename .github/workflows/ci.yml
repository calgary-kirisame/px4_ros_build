name: Build PX4 Companion Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PIOS_MANIFEST_URL: https://downloads.raspberrypi.com/os_list_imagingutility_v4.json
  XRCE_DDS_VERSION: v2.4.3
  # Detection wire for the mission engine. The tip of the distro branch, pinned.
  VISION_MSGS_REPO: https://github.com/ros-perception/vision_msgs.git
  VISION_MSGS_REF: adbf56af9f77e3c8ab2552e25dc99e4a8a77fb27

jobs:
  resolve-inputs:
    runs-on: ubuntu-24.04
    outputs:
      mission10_sha: ${{ steps.refs.outputs.mission10_sha }}
      px4_sha: ${{ steps.refs.outputs.px4_sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release inputs
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          source .github/release-inputs.env

          resolve_ref() {
            local repo="$1"
            local ref="$2"
            local sha
            if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              sha="$ref"
            else
              sha="$(git ls-remote "$repo" \
                "$ref" "refs/heads/$ref" "refs/tags/$ref" \
                | cut -f1 | head -n1)"
            fi
            test -n "$sha"
            printf '%s\n' "$sha"
          }

          mission10_sha="$(resolve_ref "$MISSION10_REPO" "$MISSION10_REF")"
          px4_sha="$(resolve_ref "$PX4_AUTOPILOT_REPO" "$PX4_AUTOPILOT_REF")"
          echo "mission10_sha=$mission10_sha" >> "$GITHUB_OUTPUT"
          echo "px4_sha=$px4_sha" >> "$GITHUB_OUTPUT"
          echo "mission10 $MISSION10_REF -> $mission10_sha"
          echo "PX4 $PX4_AUTOPILOT_REF -> $px4_sha"

  ros-base:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v6

      - name: Restore cached tarball
        id: tarball
        uses: actions/cache/restore@v5
        with:
          path: /tmp/ros-jazzy-base-pios-arm64.tar.gz
          key: ros-base-tarball-${{ hashFiles('repos/jazzy-pios-trixie.repos', 'scripts/build-ros.sh', 'scripts/install-build-deps.sh') }}

      - name: Install build dependencies
        if: steps.tarball.outputs.cache-hit != 'true'
        run: scripts/install-build-deps.sh

      - uses: hendrikmuhs/ccache-action@v1.2
        if: steps.tarball.outputs.cache-hit != 'true'
        with:
          key: ros-base-${{ hashFiles('repos/jazzy-pios-trixie.repos') }}

      - name: Build ROS 2 Jazzy
        if: steps.tarball.outputs.cache-hit != 'true'
        run: scripts/build-ros.sh

      - name: Save tarball cache
        if: steps.tarball.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /tmp/ros-jazzy-base-pios-arm64.tar.gz
          key: ros-base-tarball-${{ hashFiles('repos/jazzy-pios-trixie.repos', 'scripts/build-ros.sh', 'scripts/install-build-deps.sh') }}

      - uses: actions/upload-artifact@v7
        with:
          name: ros-jazzy-base
          path: /tmp/ros-jazzy-base-pios-arm64.tar.gz
          retention-days: 7

  xrce-agent:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Restore cached tarball
        id: tarball
        uses: actions/cache/restore@v5
        with:
          path: /tmp/xrce-dds-agent-arm64.tar.gz
          key: xrce-dds-agent-tarball-${{ env.XRCE_DDS_VERSION }}

      - name: Install build deps
        if: steps.tarball.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake git

      - name: Build Micro XRCE-DDS Agent
        if: steps.tarball.outputs.cache-hit != 'true'
        run: |
          git clone -b ${{ env.XRCE_DDS_VERSION }} --depth 1 \
            https://github.com/eProsima/Micro-XRCE-DDS-Agent.git
          cd Micro-XRCE-DDS-Agent
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=/opt/xrce-dds \
            -DCMAKE_BUILD_TYPE=Release \
            -DUAGENT_BUILD_TESTS=OFF
          make -j"$(nproc)"
          sudo make install

      - name: Package tarball
        if: steps.tarball.outputs.cache-hit != 'true'
        run: tar czf /tmp/xrce-dds-agent-arm64.tar.gz -C / opt/xrce-dds

      - name: Save tarball cache
        if: steps.tarball.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /tmp/xrce-dds-agent-arm64.tar.gz
          key: xrce-dds-agent-tarball-${{ env.XRCE_DDS_VERSION }}

      - uses: actions/upload-artifact@v7
        with:
          name: xrce-dds-agent
          path: /tmp/xrce-dds-agent-arm64.tar.gz
          retention-days: 7

  py-debs:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v6

      - name: Restore cached debs
        id: debs
        uses: actions/cache/restore@v5
        with:
          path: /tmp/py-debs
          key: py-debs-${{ hashFiles('scripts/build-py-debs.sh') }}

      - name: Install build dependencies
        if: steps.debs.outputs.cache-hit != 'true'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-setuptools python3-wheel \
            dpkg-dev curl jq ca-certificates

      - name: Build .debs
        if: steps.debs.outputs.cache-hit != 'true'
        run: scripts/build-py-debs.sh

      - name: Save cache
        if: steps.debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /tmp/py-debs
          key: py-debs-${{ hashFiles('scripts/build-py-debs.sh') }}

      - uses: actions/upload-artifact@v7
        with:
          name: py-debs
          path: /tmp/py-debs/*.deb
          retention-days: 7

  px4-pkgs:
    needs: [resolve-inputs, ros-base]
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v6

      - name: Restore cached outputs
        id: pkgs-cache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/ros-jazzy-px4-arm64.tar.gz
          key: px4-pkgs-outputs-${{ needs.resolve-inputs.outputs.px4_sha }}-${{ hashFiles('.github/workflows/ci.yml', 'repos/jazzy-pios-trixie.repos', 'scripts/build-ros.sh', 'scripts/install-build-deps.sh', 'scripts/sync-px4-msgs.sh') }}

      - name: Install build dependencies
        if: steps.pkgs-cache.outputs.cache-hit != 'true'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git python3 python3-pip python3-dev \
            python3-setuptools python3-numpy python3-yaml python3-empy \
            python3-opencv python3-lark \
            libtinyxml2-dev libyaml-cpp-dev libspdlog-dev libopencv-dev libssl-dev \
            pkg-config ccache dpkg-dev
          pip3 install --break-system-packages \
            colcon-common-extensions catkin_pkg lark

      - uses: hendrikmuhs/ccache-action@v1.2
        if: steps.pkgs-cache.outputs.cache-hit != 'true'
        with:
          key: px4-pkgs-${{ needs.resolve-inputs.outputs.px4_sha }}-${{ hashFiles('scripts/sync-px4-msgs.sh') }}

      - uses: actions/download-artifact@v8
        if: steps.pkgs-cache.outputs.cache-hit != 'true'
        with:
          name: ros-jazzy-base
          path: /tmp

      - name: Extract ROS 2 base
        if: steps.pkgs-cache.outputs.cache-hit != 'true'
        run: tar xzf /tmp/ros-jazzy-base-pios-arm64.tar.gz -C /

      - name: Sync px4_msgs from PX4 firmware
        if: steps.pkgs-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          source .github/release-inputs.env
          scripts/sync-px4-msgs.sh "$PX4_AUTOPILOT_REPO" "${{ needs.resolve-inputs.outputs.px4_sha }}"

      - name: Fetch vision_msgs
        if: steps.pkgs-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --filter=blob:none "${VISION_MSGS_REPO}" /tmp/vision_msgs
          git -C /tmp/vision_msgs checkout --detach "${VISION_MSGS_REF}"

      - name: Build platform interfaces
        if: steps.pkgs-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          mkdir -p /px4_ws/src
          cp -r src/px4_msgs /px4_ws/src/
          # vision_msgs carries Detection2DArray, the wire between the tag
          # detector and the mission engine. The rviz plugins stay out.
          cp -r /tmp/vision_msgs/vision_msgs /px4_ws/src/
          cd /px4_ws
          export PATH="/usr/lib/ccache:$PATH"
          colcon build \
            --packages-select px4_msgs vision_msgs \
            --merge-install \
            --install-base /opt/ros/jazzy \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=OFF \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Package tarball
        if: steps.pkgs-cache.outputs.cache-hit != 'true'
        run: tar czf /tmp/ros-jazzy-px4-arm64.tar.gz -C / opt/ros/jazzy

      - name: Save outputs cache
        if: steps.pkgs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /tmp/ros-jazzy-px4-arm64.tar.gz
          key: px4-pkgs-outputs-${{ needs.resolve-inputs.outputs.px4_sha }}-${{ hashFiles('.github/workflows/ci.yml', 'repos/jazzy-pios-trixie.repos', 'scripts/build-ros.sh', 'scripts/install-build-deps.sh', 'scripts/sync-px4-msgs.sh') }}

      - uses: actions/upload-artifact@v7
        with:
          name: ros-jazzy-px4
          path: /tmp/ros-jazzy-px4-arm64.tar.gz
          retention-days: 7

  px4-firmware:
    needs: resolve-inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Fetch the resolved PX4 source
        run: |
          set -euo pipefail
          source .github/release-inputs.env
          git clone "$PX4_AUTOPILOT_REPO" /tmp/PX4-Autopilot
          git -C /tmp/PX4-Autopilot checkout --detach "${{ needs.resolve-inputs.outputs.px4_sha }}"
          git -C /tmp/PX4-Autopilot submodule update --init --recursive

      - name: Install PX4 build dependencies
        working-directory: /tmp/PX4-Autopilot
        run: ./Tools/setup/ubuntu.sh --no-sim-tools

      - name: Build FMUv5 firmware
        working-directory: /tmp/PX4-Autopilot
        run: make -j"$(nproc)" px4_fmu-v5_default

      - name: Verify and package firmware
        run: |
          set -euo pipefail
          firmware=/tmp/PX4-Autopilot/build/px4_fmu-v5_default/px4_fmu-v5_default.px4
          jq -e --arg sha "${{ needs.resolve-inputs.outputs.px4_sha }}" \
            '.git_hash == $sha' "$firmware" >/dev/null
          mkdir -p /tmp/px4-firmware
          install -m 0644 "$firmware" /tmp/px4-firmware/
          install -m 0755 /tmp/PX4-Autopilot/Tools/px4_uploader.py \
            /tmp/px4-firmware/

      - uses: actions/upload-artifact@v7
        with:
          name: px4-firmware
          path: /tmp/px4-firmware/
          retention-days: 30

  mission10-uwb:
    needs: resolve-inputs
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git jq pkg-config
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.92.0
          "$HOME/.cargo/bin/rustup" target add \
            aarch64-unknown-linux-gnu thumbv7em-none-eabihf

      - name: Fetch the resolved Mission 10 source
        shell: bash
        run: |
          set -euo pipefail
          source .github/release-inputs.env
          git clone "$MISSION10_REPO" /tmp/mission10
          git -C /tmp/mission10 checkout --detach "${{ needs.resolve-inputs.outputs.mission10_sha }}"

      - name: Test and build UWB software
        working-directory: /tmp/mission10/uwb
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --locked --target aarch64-unknown-linux-gnu \
            -p mission10-uwb-protocol -p dw1000-rs -p dw1000-radio
          cargo build --locked --release --target aarch64-unknown-linux-gnu \
            -p dw1000-radio
          cargo build --locked --release -p mission10-dwm3001

      - name: Package UWB release
        run: |
          set -euo pipefail
          root=/tmp/uwb-release
          install -D -m 0755 \
            /tmp/mission10/uwb/target/aarch64-unknown-linux-gnu/release/dw1000-radio \
            "$root/usr/local/bin/dw1000-radio"
          install -D -m 0644 \
            /tmp/mission10/uwb/target/thumbv7em-none-eabihf/release/mission10-dwm3001 \
            "$root/opt/maav/firmware/mission10-dwm3001"
          tar czf /tmp/mission10-uwb-arm64.tar.gz -C "$root" .
          air_version="$(sed -n 's/.*AIR_PROTOCOL_VERSION: u8 = \([0-9][0-9]*\);/\1/p' \
            /tmp/mission10/uwb/protocol/src/air.rs)"
          host_version="$(sed -n 's/.*HOST_PROTOCOL_VERSION: u8 = \([0-9][0-9]*\);/\1/p' \
            /tmp/mission10/uwb/protocol/src/host.rs)"
          test -n "$air_version"
          test -n "$host_version"
          jq -n --argjson air "$air_version" --argjson host "$host_version" \
            '{uwb_air: $air, uwb_host: $host}' > /tmp/uwb-protocol.json

      - uses: actions/upload-artifact@v7
        with:
          name: mission10-uwb
          path: |
            /tmp/mission10-uwb-arm64.tar.gz
            /tmp/uwb-protocol.json
          retention-days: 30

  mission10-runtime:
    needs: [resolve-inputs, px4-pkgs]
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake git python3 python3-dev python3-numpy \
            python3-osrf-pycommon python3-pip liblttng-ust1t64
          pip3 install --break-system-packages \
            colcon-common-extensions catkin_pkg lark

      - uses: actions/download-artifact@v8
        with:
          name: ros-jazzy-px4
          path: /tmp

      - name: Install the matched ROS underlay
        run: tar xzf /tmp/ros-jazzy-px4-arm64.tar.gz -C /

      - name: Fetch the matched Mission 10 source
        shell: bash
        run: |
          set -euo pipefail
          source .github/release-inputs.env
          mkdir -p /home/maav
          git clone "$MISSION10_REPO" /home/maav/mission10
          git -C /home/maav/mission10 checkout -B "$MISSION10_REF" \
            "${{ needs.resolve-inputs.outputs.mission10_sha }}"
          git -C /home/maav/mission10 branch --set-upstream-to \
            "origin/$MISSION10_REF" "$MISSION10_REF"

      - name: Build the flight runtime
        working-directory: /home/maav/mission10
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          set -u
          colcon build \
            --base-paths ros \
            --packages-select \
              flight_interfaces flight_lib px4_offboard flight_intelligent \
              mission_engine sensing uwb_gateway \
            --symlink-install \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Test the flight runtime
        working-directory: /home/maav/mission10
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          set -u
          python3 -m pytest -q ros/flight_lib/test
          python3 -m pytest -q ros/px4_offboard/test
          python3 -m pytest -q ros/flight_intelligent/test
          python3 -m pytest -q ros/mission_engine/test
          python3 -m pytest -q ros/sensing/test/test_frame_sinks.py

      - name: Package Mission 10 runtime
        run: |
          rm -rf /home/maav/mission10/log
          tar czf /tmp/mission10-runtime-arm64.tar.gz \
            --owner=1000 --group=1000 -C / home/maav/mission10

      - uses: actions/upload-artifact@v7
        with:
          name: mission10-runtime
          path: /tmp/mission10-runtime-arm64.tar.gz
          retention-days: 30

  assemble-image:
    needs:
      - resolve-inputs
      - ros-base
      - xrce-agent
      - px4-pkgs
      - px4-firmware
      - mission10-uwb
      - mission10-runtime
      - py-debs
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y kpartx parted e2fsprogs xz-utils systemd-container wget jq

      - uses: actions/download-artifact@v8
        with:
          name: ros-jazzy-px4
          path: /tmp/artifacts
      - uses: actions/download-artifact@v8
        with:
          name: xrce-dds-agent
          path: /tmp/artifacts
      - uses: actions/download-artifact@v8
        with:
          name: py-debs
          path: /tmp/artifacts/py-debs
      - uses: actions/download-artifact@v8
        with:
          name: px4-firmware
          path: /tmp/artifacts/px4-firmware
      - uses: actions/download-artifact@v8
        with:
          name: mission10-uwb
          path: /tmp/artifacts
      - uses: actions/download-artifact@v8
        with:
          name: mission10-runtime
          path: /tmp/artifacts

      - name: Write matched release metadata
        run: |
          set -euo pipefail
          source .github/release-inputs.env
          jq -n \
            --slurpfile protocols /tmp/artifacts/uwb-protocol.json \
            --arg image_repo "$GITHUB_REPOSITORY" \
            --arg image_sha "$GITHUB_SHA" \
            --arg mission10_repo "$MISSION10_REPO" \
            --arg mission10_ref "$MISSION10_REF" \
            --arg mission10_sha "${{ needs.resolve-inputs.outputs.mission10_sha }}" \
            --arg px4_repo "$PX4_AUTOPILOT_REPO" \
            --arg px4_ref "$PX4_AUTOPILOT_REF" \
            --arg px4_sha "${{ needs.resolve-inputs.outputs.px4_sha }}" \
            '{schema: 1,
              protocols: $protocols[0],
              sources: {
                px4_ros_build: {repository: $image_repo, sha: $image_sha},
                mission10: {repository: $mission10_repo, ref: $mission10_ref, sha: $mission10_sha},
                px4: {repository: $px4_repo, ref: $px4_ref, sha: $px4_sha}
              }}' > /tmp/artifacts/image-release.json

      - name: Resolve Pi OS URL
        id: pios
        run: |
          PIOS_URL=$(wget -qO- "${{ env.PIOS_MANIFEST_URL }}" | jq -r '
            [.. | objects | select(.name? == "Raspberry Pi OS Lite (64-bit)")] | first | .url')
          echo "url=$PIOS_URL" >> "$GITHUB_OUTPUT"
          echo "cache_key=pios-$(echo "$PIOS_URL" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore Pi OS cache
        id: pios-cache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/pios.img.xz
          key: ${{ steps.pios.outputs.cache_key }}

      - name: Download Pi OS image
        if: steps.pios-cache.outputs.cache-hit != 'true'
        run: wget -q -O /tmp/pios.img.xz "${{ steps.pios.outputs.url }}"

      - name: Save Pi OS cache
        if: steps.pios-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /tmp/pios.img.xz
          key: ${{ steps.pios.outputs.cache_key }}

      - name: Build image
        run: sudo scripts/configure-image.sh

      - uses: actions/upload-artifact@v7
        with:
          name: px4-companion-image
          path: |
            /tmp/px4-companion-cm5-*.img.xz
            /tmp/hailo-build-metadata.json
            /tmp/image-release.json
          retention-days: 30
